name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate icon
        run: python generate_icon.py

      - name: Run regression tests
        run: python -m unittest -v test_engine.py

      - name: Build Video Optimizer Studio
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name VideoOptimizerStudio --icon video_optimizer_studio.ico --version-file version_info.txt --add-data "video_optimizer_studio.ico;." --add-data "video_optimizer_studio_icon.png;." --collect-all customtkinter video_optimizer_studio.py

      - name: Verify one-file archive
        shell: pwsh
        run: |
          $exe = "dist\VideoOptimizerStudio.exe"
          if (!(Test-Path $exe)) { throw "EXE was not created." }
          if ((Get-Item $exe).Length -lt 5MB) { throw "EXE is unexpectedly small." }
          python -m PyInstaller.utils.cliutils.archive_viewer -l $exe | Out-Null

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoOptimizerStudio-Windows
          path: dist/VideoOptimizerStudio.exe
